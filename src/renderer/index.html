<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Threadlands</title>
<style>
  /* Kaushan Script, shipped locally so the map never waits on a network. */
  @font-face {
    font-family: 'Kaushan Script';
    font-style: normal;
    font-weight: 400;
    src: url('./assets/fonts/kaushan-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
      U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
      U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Kaushan Script';
    font-style: normal;
    font-weight: 400;
    src: url('./assets/fonts/kaushan-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
      U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
      U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  /* Libre Baskerville — Google Fonts' screen-oriented Baskerville. Bold is
     synthesised; the family ships no separate bold face at this weight. */
  @font-face {
    font-family: 'Libre Baskerville';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./assets/fonts/libre-baskerville-400.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Libre Baskerville';
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url('./assets/fonts/libre-baskerville-400i.woff2') format('woff2');
  }

  :root {
    --ink: #e8eef0;
    --dim: #8fa6ad;
    --panel: #16232a;
    --panel-2: #1d2f38;
    --edge: #2b4350;
    --accent: #e0b050;
    --flag: #e05a3c;
    --working: #58c0a8;
    --water: #16262e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--water);
    color: var(--ink);
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: grid;
    grid-template-columns: 1fr 7px var(--aside-w, 380px);
    grid-template-rows: 44px 1fr;
  }

  /* The handle between map and panel. Wider than it looks, so it is easy to
     grab, with the visible line drawn inside it. */
  .splitter {
    cursor: col-resize;
    position: relative;
    background: var(--edge);
    -webkit-app-region: no-drag;
  }
  .splitter::after {
    content: ""; position: absolute; inset: 0 -4px;
  }
  .splitter:hover, .splitter.dragging { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }

  /* The window's own title bar. Draggable, so the system treats it as one —
     which is what makes double-clicking it zoom the window. */
  .topbar {
    grid-column: 1 / -1;
    -webkit-app-region: drag;
    /* Centre, not baseline: baseline lines the wordmark up with the smaller
       context text and leaves the whole row sitting high in the bar. */
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px 0 86px;   /* room for the traffic lights */
    /* The panel's ink, so the chrome is one warm family rather than navy
       against parchment. */
    background: #33291b;
    border-bottom: 1px solid rgba(255, 246, 226, .14);
    user-select: none;
    font-family: 'Libre Baskerville', ui-serif, Georgia, serif;
  }
  .topbar h1 {
    font-size: 14px; margin: 0; letter-spacing: .12em; line-height: 1;
    text-transform: uppercase; color: #e8cf96;
    font-weight: 400;
  }
  .topbar .where { color: rgba(245, 234, 212, .62); font-size: 12px; line-height: 1; }
  .topbar .spacer { flex: 1; }
  .topbar button {
    -webkit-app-region: no-drag;
    padding: 3px 10px; font-size: 11px; line-height: 1.5;
    font-family: inherit;
    color: rgba(245, 234, 212, .9);
    background: rgba(255, 246, 226, .08);
    border-color: rgba(255, 246, 226, .26);
  }
  .topbar button:hover {
    background: rgba(255, 246, 226, .16);
    border-color: #e8cf96;
    color: #fbf2df;
  }

  #map { display: block; width: 100%; height: 100%; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  /* The side panel is parchment. Everything inside it reads from these tokens,
     so redefining them here reskins the whole panel rather than each rule. */
  aside {
    --ink: #33291b;
    --dim: #7b6a50;
    --panel: transparent;
    --panel-2: rgba(118, 92, 48, .14);
    --edge: rgba(94, 72, 38, .34);
    --accent: #8a6410;
    --working: #3d7a5c;
    --flag: #a33a22;
    min-width: 0;
    display: flex; flex-direction: column;
    min-height: 0;
    color: var(--ink);
    /* Libre Baskerville runs large for its nominal size, so the panel steps
       down slightly and opens up the leading to compensate. */
    font-family: 'Libre Baskerville', ui-serif, Georgia, serif;
    font-size: 12px;
    line-height: 1.65;
    /* A white veil over the parchment, so it reads as a tint rather than a
       texture you have to look through. Raise --veil to knock it back further. */
    --veil: .46;
    background-color: #fffdf7;
    background-image:
      linear-gradient(rgba(255, 253, 247, var(--veil)), rgba(255, 253, 247, var(--veil))),
      url("./assets/parchment.webp");
    background-size: cover, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
    box-shadow: inset 6px 0 14px -8px rgba(40, 26, 8, .6);
  }

  /* The few places that carried a literal dark colour rather than a token. */
  aside input, aside select, aside textarea {
    background: rgba(255, 250, 238, .62);
    border-color: rgba(94, 72, 38, .4);
  }
  aside input::placeholder, aside textarea::placeholder { color: rgba(90, 76, 52, .7); }
  aside button { background: rgba(255, 250, 238, .5); }
  aside button:hover { border-color: var(--accent); background: rgba(255, 250, 238, .8); }
  aside button.primary { background: var(--accent); border-color: var(--accent); color: #fdf4dd; }
  aside .msg.you { background: rgba(138, 100, 16, .17); }
  aside .msg.governor { background: rgba(255, 250, 238, .55); }
  aside .msg.system { color: #8a5a10; }
  aside .flag, aside .confirm {
    background: rgba(163, 58, 34, .1);
    border-color: rgba(163, 58, 34, .55);
  }
  aside .flag h3, aside .confirm .what b { color: #8e2f18; }
  aside .track { background: rgba(70, 54, 28, .22); }
  aside hr { border-top-color: var(--edge); }

  .pane { padding: 14px 16px; overflow-y: auto; flex: 1; min-height: 0; }
  .empty { color: var(--dim); padding: 24px 16px; }
  .empty kbd {
    background: var(--panel-2); border: 1px solid var(--edge);
    border-radius: 4px; padding: 1px 5px; font: inherit; font-size: 11px;
  }

  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin: 0 0 8px; }
  aside h2 { font-size: 11px; letter-spacing: .1em; }
  aside label { font-size: 10px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .row b { font-weight: 600; }
  .muted { color: var(--dim); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; overflow-wrap: anywhere; }
  .row > span:last-child { text-align: right; }

  button {
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 6px;
    padding: 6px 11px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #20160a; font-weight: 600; }
  button.danger:hover { border-color: var(--flag); color: var(--flag); }
  button:disabled { opacity: .45; cursor: default; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }

  input, select, textarea {
    background: #101b21; color: var(--ink);
    border: 1px solid var(--edge); border-radius: 6px;
    padding: 7px 9px; font: inherit; width: 100%;
  }
  textarea { resize: none; }
  label { display: block; margin: 10px 0 4px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }

  /* chat */
  #chat { display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 7px 10px; border-radius: 8px; max-width: 94%; white-space: pre-wrap; word-break: break-word; }
  .msg.md { white-space: normal; word-break: normal; overflow-wrap: anywhere; }
  .msg.you { background: #243c48; align-self: flex-end; }
  .msg.governor { background: var(--panel-2); }
  .msg.tool { background: transparent; color: var(--dim); font-family: ui-monospace, Menlo, monospace; font-size: 11px; padding: 2px 4px; }
  .msg.system { color: var(--accent); font-size: 11px; padding: 2px 4px; }

  /* A run of tool work between two bubbles. */
  .run { margin: 2px 0; }
  .runtoggle {
    -webkit-appearance: none;
    display: flex; align-items: baseline; gap: 7px; width: 100%;
    background: none; border: 0; border-radius: 6px;
    padding: 3px 6px; cursor: pointer;
    font: inherit; font-size: 11px; color: var(--dim); text-align: left;
  }
  .runtoggle:hover { background: rgba(120, 95, 55, .12); color: var(--ink); }
  .runtoggle .caret { width: .8em; flex: none; }
  .runtoggle .runhint { margin-left: auto; opacity: .75; }
  .runbody { display: none; padding-left: 14px; }
  .run.open .runbody { display: block; }

  /* Rendered markdown inside a governor's reply. */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .6em; }
  .md h1, .md h2, .md h3, .md h4 {
    font-size: 1em; margin: .9em 0 .35em; letter-spacing: 0;
    text-transform: none; color: inherit; font-weight: 700;
  }
  .md h1 { font-size: 1.15em; }
  .md h2 { font-size: 1.07em; }
  .md ul, .md ol { margin: 0 0 .6em; padding-left: 1.3em; }
  .md li { margin: .15em 0; }
  .md li > p { margin: 0; }
  .md code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .88em;
    background: rgba(70, 54, 28, .13);
    border-radius: 4px; padding: .08em .35em;
    overflow-wrap: anywhere;
  }
  .md pre {
    background: rgba(40, 32, 16, .12);
    border: 1px solid var(--edge);
    border-radius: 7px; padding: 9px 11px; margin: 0 0 .6em;
    overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; font-size: .85em; line-height: 1.5; }
  .md blockquote {
    margin: 0 0 .6em; padding: .1em 0 .1em .8em;
    border-left: 3px solid var(--edge); color: var(--dim);
  }
  .md a { color: #8a5a10; text-decoration: underline; cursor: pointer; }
  .md hr { margin: .8em 0; }
  .md table { border-collapse: collapse; margin: 0 0 .6em; font-size: .95em; }
  .md th, .md td { border: 1px solid var(--edge); padding: 3px 7px; text-align: left; }
  .md img { max-width: 100%; }

  .composer { border-top: 1px solid var(--edge); padding: 10px 16px 16px; }
  .composer .btns { margin: 8px 0 0; }

  .confirm {
    border: 1px solid var(--flag); background: #2a1a16;
    border-radius: 8px; padding: 11px 12px; margin: 10px 0;
  }
  .confirm .what { font-size: 12px; margin-bottom: 9px; }
  .confirm input { margin-bottom: 2px; }

  /* flag */
  .flag {
    border: 1px solid var(--flag); background: #2a1a16;
    border-radius: 8px; padding: 11px 12px; margin-bottom: 12px;
  }
  .flag h3 { margin: 0 0 4px; font-size: 12px; color: var(--flag); text-transform: uppercase; letter-spacing: .06em; }
  .flag .what { font-family: ui-monospace, Menlo, monospace; font-size: 11px; margin-bottom: 9px; word-break: break-all; }

  /* meters */
  .meter { margin-bottom: 11px; }
  .meter .top { display: flex; justify-content: space-between; font-size: 12px; }
  .track { height: 6px; background: #0e171c; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--working); }
  .fill.warning { background: var(--accent); }
  .fill.critical { background: var(--flag); }
  .plan { color: var(--accent); font-weight: 600; text-transform: capitalize; }
  hr { border: 0; border-top: 1px solid var(--edge); margin: 16px 0; }

  .toast {
    position: fixed; bottom: 18px; left: 18px;
    background: var(--flag); color: #fff; padding: 9px 13px;
    border-radius: 7px; font-size: 12px; max-width: 50vw;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>Threadlands</h1>
    <span class="where" id="hint"></span>
    <span class="spacer"></span>
    <button id="zoomwin" title="Fill the screen">Fill screen</button>
  </div>
  <canvas id="map"></canvas>
  <div class="splitter" id="splitter" title="Drag to resize · double-click to reset"></div>
  <aside>
    <div class="pane" id="pane"></div>
    <div class="composer hidden" id="composer">
      <textarea id="prompt" rows="3" placeholder="Talk to the governor…  (Enter sends, Shift+Enter for a new line)"></textarea>
      <div class="btns">
        <button class="primary" id="send">Send</button>
        <button id="terminal">Open terminal</button>
        <button id="stop">Interrupt</button>
      </div>
    </div>
  </aside>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
